name: Update brain

on:
  schedule:
    - cron: "23 4 * * *"          # daily, a few minutes past the hour
  workflow_dispatch:               # a "run it now" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/brain.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect commit activity
        env:
          GH_TOKEN: ${{ secrets.BRAIN_TOKEN || github.token }}
        run: python3 scripts/collect_activity.py

      - name: Render the slice
        run: python3 scripts/render_brain.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --staged --quiet || git commit -m "brain: refresh from commit activity"
          git push
